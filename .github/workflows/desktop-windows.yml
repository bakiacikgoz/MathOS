name: Desktop · Windows

# Builds the Tauri desktop app on Windows and publishes the installer as a downloadable artifact.
# Before packaging, the compiled MathOS engine (sidecar) must answer real CLI requests on Windows
# and store and read a key in Windows Credential Manager.
on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths:
      - "apps/desktop/**"
      - "apps/tui/src/**"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "tsconfig.json"
      - ".github/workflows/desktop-windows.yml"

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.0

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      - name: Typecheck the desktop app
        working-directory: apps/desktop
        run: bun run typecheck

      - name: Test the desktop app
        working-directory: apps/desktop
        run: bun test

      - name: Build the MathOS engine (sidecar)
        working-directory: apps/desktop
        run: bun scripts/build-host.ts --triple=x86_64-pc-windows-msvc

      - name: Smoke-test the engine on Windows
        working-directory: apps/desktop
        run: bun scripts/smoke-host.ts src-tauri/binaries/mathos-host-x86_64-pc-windows-msvc.exe --secret-store

      - name: Build the installer
        working-directory: apps/desktop
        run: bunx tauri build --ci --config src-tauri/tauri.bundle.conf.json -- --locked

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MathOS-windows-x64-setup
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
