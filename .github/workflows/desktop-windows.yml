name: Desktop · Windows

# Builds the Tauri desktop app on Windows and publishes the installer as a downloadable artifact.
# Before packaging, the compiled MathOS engine (sidecar) must answer real CLI requests on Windows
# and store and read a key in Windows Credential Manager.
on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths:
      - "apps/desktop/**"
      - "apps/tui/src/**"
      - "packages/**"
      - "bun.lock"
      - ".github/workflows/desktop-windows.yml"

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd apps/desktop
          bun install --frozen-lockfile

      - name: Typecheck and test the desktop app
        working-directory: apps/desktop
        run: |
          bun run typecheck
          bun test

      - name: Build the MathOS engine (sidecar)
        working-directory: apps/desktop
        run: bun scripts/build-host.ts --triple=x86_64-pc-windows-msvc

      - name: Smoke-test the engine on Windows
        working-directory: apps/desktop
        run: bun scripts/smoke-host.ts src-tauri/binaries/mathos-host-x86_64-pc-windows-msvc.exe --secret-store

      - name: Build the installer
        working-directory: apps/desktop
        run: bunx tauri build --config src-tauri/tauri.bundle.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: MathOS-windows-x64-setup
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
